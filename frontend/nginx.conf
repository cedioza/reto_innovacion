# SPA con history mode: toda ruta sin archivo cae en index.html (fallback),
# así /aseguradora/{token} y /panel funcionan al abrirse directo o refrescar.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bundles de Vite: llevan hash en el nombre → cache larga e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html sin cache agresiva: cada deploy debe verse al refrescar.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback de SPA (el corazón de este archivo).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
